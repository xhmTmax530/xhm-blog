baseURL = "https://blog.agentxx.xyz/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "star徐的随笔"
theme = "hugo-xmin"
enableRobotsTXT = true
enableEmoji = true

[params]
  music = true
  description = "技术、生活、钓鱼骑行与随想"
  author = "星际徐"
  since = "2026"

[[menus.main]]
  name = "首页"
  url = "/"
  weight = 10
[[menus.main]]
  name = "全部文章"
  url = "/posts/"
  weight = 20
[[menus.main]]
  name = "分类"
  url = "/categories/"
  weight = 30
[[menus.main]]
  name = "关于"
  url = "/about/"
  weight = 50

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "monokailight"
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true
